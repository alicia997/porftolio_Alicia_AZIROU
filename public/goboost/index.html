<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Prototype GoBoost intégré depuis Figma" />
  <title>GoBoost — Prototype</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="toolbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">G</span>
        <div class="brand-text">
          <strong>GoBoost</strong>
          <span>Prototype interactif</span>
        </div>
      </div>

      <button
        class="fullscreen-button"
        id="fullscreenButton"
        type="button"
        aria-label="Afficher le prototype en plein écran"
      >
        Plein écran
      </button>
    </header>

    <section class="prototype-wrapper" id="prototypeWrapper">
      <div class="loader" id="loader" role="status" aria-live="polite">
        <div class="spinner" aria-hidden="true"></div>
        <p>Chargement de GoBoost…</p>
      </div>


      <iframe
        id="figmaPrototype"
        style="border: 1px solid rgba(0, 0, 0, 0.1);"
        width="800"
        height="450"
        title="Prototype Figma GoBoost"
        src="https://embed.figma.com/proto/VELeiwiISMU56u5pcK52Ef/GoBoost?node-id=69-1790&p=f&scaling=min-zoom&content-scaling=fixed&page-id=10%3A604&embed-host=share"
        allowfullscreen
      ></iframe>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
