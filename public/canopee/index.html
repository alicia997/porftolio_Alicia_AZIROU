<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Prototype Canopée intégré depuis Figma" />
  <title>Canopée — Prototype</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="toolbar">
      <div class="brand">
        <span class="brand-dot" aria-hidden="true"></span>
        <span>Canopée</span>
      </div>

      <button
        class="fullscreen-button"
        id="fullscreenButton"
        type="button"
        aria-label="Afficher le prototype en plein écran"
      >
        Plein écran
      </button>
    </header>

    <section class="prototype-wrapper" id="prototypeWrapper">
      <div class="loader" id="loader" role="status" aria-live="polite">
        <div class="spinner" aria-hidden="true"></div>
        <p>Chargement du prototype…</p>
      </div>

      <iframe
        id="figmaPrototype"
        title="Prototype Figma Canopée"
        src="https://embed.figma.com/proto/ba7dGzpLM5ImbpTpNhVqZ0/Canop%C3%A9e?node-id=168-167&p=f&scaling=scale-down&content-scaling=fixed&page-id=0%3A1&starting-point-node-id=168%3A167&embed-host=share"
        allowfullscreen
        loading="eager"
      ></iframe>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
